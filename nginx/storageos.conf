# ==============================================================================
# StorageOS Production Nginx Reverse Proxy Configuration
# Optimized for self-hosted cloud storage, large file streaming, and security.
# ==============================================================================

upstream storageos_upstream {
    # In Docker/Podman compose environments, 'storageos' resolves to the app container.
    # For host/bare-metal systemd deployments, change to: server 127.0.0.1:5000;
    server storageos:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP Server - StorageOS reverse proxy
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client upload limit - 10 GB cloud storage upload support
    client_max_body_size 10G;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Gzip compression for dynamic assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob:; font-src 'self' data:;" always;

    # Healthcheck endpoint (fast bypass)
    location = /health {
        proxy_pass http://storageos_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Static file asset caching
    location /static/ {
        proxy_pass http://storageos_upstream/static/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Main application proxy & streaming file uploads/downloads
    location / {
        proxy_pass http://storageos_upstream;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Performance tuning for large file transfer
        # Disable buffering to stream directly to disk without exhausting proxy memory
        proxy_request_buffering off;
        proxy_buffering off;

        # Generous timeouts for large multi-gigabyte uploads and downloads
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
