services:
  storageos:
    build:
      context: .
      dockerfile: Dockerfile
    image: storageos:1.0.0
    container_name: storageos_app
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - PORT=5000
      - STORAGEOS_SECRET_KEY=${STORAGEOS_SECRET_KEY:-change_this_secret_key_in_production}
      - STORAGEOS_STORAGE_ROOT=/data/storage
      - STORAGEOS_DB_PATH=/data/database/storageos.db
      - STORAGEOS_DEFAULT_QUOTA_MB=5120
      - PYTHONUNBUFFERED=1
    volumes:
      - storageos_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - storageos_net
    expose:
      - "5000"

  proxy:
    image: nginx:1.27-alpine
    container_name: storageos_proxy
    restart: unless-stopped
    ports:
      - "${STORAGEOS_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/storageos.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      storageos:
        condition: service_healthy
    networks:
      - storageos_net

volumes:
  storageos_data:
    driver: local

networks:
  storageos_net:
    driver: bridge
